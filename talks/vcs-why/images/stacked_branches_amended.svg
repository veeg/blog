<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="title desc">
  <title id="title">A stack after amending c1</title>
  <desc id="desc">After amending c1, cart/discount-codes holds new commits c1′ and c2′ on top of the base commit on trunk. cart/discount-api, with c3 and c4, is still built on the old c1 and c2, and cart/discount-ui, with c5 and c6, sits on top of c4.</desc>
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
    .pr { font-size: 12px; font-weight: 400; fill: #6f6a62; }
    .cid { font-size: 10px; font-weight: 400; fill: #6f6a62; }
    .note { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-style: italic; font-weight: 400; fill: #6f6a62; }
    .edge { fill: none; stroke-width: 4; stroke-linecap: round; }
    .leader { fill: none; stroke: #6f6a62; stroke-width: 1.5; stroke-dasharray: 3 5; }
    .commit { fill: #fbf8f1; stroke-width: 3; }
    .ghost { stroke: #6f6a62; stroke-opacity: 0.6; }
    .edge.ghost { stroke-width: 2.5; stroke-dasharray: 4 5; }
    .commit.ghost { stroke-width: 2; }
    .s-main { stroke: #1d6f66; }
    .f-main { fill: #1d6f66; }
    .s-s1 { stroke: #c2410c; }
    .f-s1 { fill: #c2410c; }
    .s-s2 { stroke: #7e22ce; }
    .f-s2 { fill: #7e22ce; }
    .s-s3 { stroke: #1d4ed8; }
    .f-s3 { fill: #1d4ed8; }
    @media (prefers-color-scheme: dark) {
      .pr, .cid, .note { fill: #8d8a83; }
      .leader, .ghost { stroke: #8d8a83; }
      .commit { fill: #121417; }
      .s-main { stroke: #6fc2b8; }
      .f-main { fill: #6fc2b8; }
      .s-s1 { stroke: #fb923c; }
      .f-s1 { fill: #fb923c; }
      .s-s2 { stroke: #c084fc; }
      .f-s2 { fill: #c084fc; }
      .s-s3 { stroke: #60a5fa; }
      .f-s3 { fill: #60a5fa; }
    }
  </style>

  <path class="leader" d="M534 70 H573"/>
  <path class="leader" d="M404 130 H573"/>
  <path class="leader" d="M274 250 H573"/>
  <path class="edge s-main" d="M70 310 H570"/>
  <path class="edge ghost" d="M130 310 C165 310, 165 190, 200 190"/>
  <path class="edge ghost" d="M200 190 H260"/>
  <path class="edge s-s1" d="M130 310 C165 310, 165 250, 200 250"/>
  <path class="edge s-s1" d="M200 250 H260"/>
  <path class="edge s-s2" d="M260 190 C295 190, 295 130, 330 130"/>
  <path class="edge s-s2" d="M330 130 H390"/>
  <path class="edge s-s3" d="M390 130 C425 130, 425 70, 460 70"/>
  <path class="edge s-s3" d="M460 70 H520"/>

  <circle class="commit s-main" cx="70" cy="310" r="8"/>
  <circle class="commit s-main" cx="130" cy="310" r="8"/>
  <text x="130" y="334" text-anchor="middle" class="cid">base</text>
  <circle class="commit ghost" cx="200" cy="190" r="8"/>
  <circle class="commit ghost" cx="260" cy="190" r="8"/>
  <text x="200" y="214" text-anchor="middle" class="cid">c1</text>
  <text x="260" y="214" text-anchor="middle" class="cid">c2</text>
  <circle class="commit s-s1" cx="200" cy="250" r="8"/>
  <circle class="commit s-s1" cx="260" cy="250" r="8"/>
  <text x="200" y="274" text-anchor="middle" class="cid">c1′</text>
  <text x="260" y="274" text-anchor="middle" class="cid">c2′</text>
  <circle class="commit s-s2" cx="330" cy="130" r="8"/>
  <circle class="commit s-s2" cx="390" cy="130" r="8"/>
  <text x="330" y="154" text-anchor="middle" class="cid">c3</text>
  <text x="390" y="154" text-anchor="middle" class="cid">c4</text>
  <circle class="commit s-s3" cx="460" cy="70" r="8"/>
  <circle class="commit s-s3" cx="520" cy="70" r="8"/>
  <text x="460" y="94" text-anchor="middle" class="cid">c5</text>
  <text x="520" y="94" text-anchor="middle" class="cid">c6</text>
  <text x="184" y="194" text-anchor="end" class="note">old</text>

  <text x="585" y="68" class="f-s3">cart/discount-ui</text>
  <text x="585" y="86" class="pr">PR #3 → cart/discount-api</text>
  <text x="585" y="128" class="f-s2">cart/discount-api</text>
  <text x="585" y="146" class="pr">PR #2 → cart/discount-codes</text>
  <text x="585" y="248" class="f-s1">cart/discount-codes</text>
  <text x="585" y="266" class="pr">PR #1 → trunk</text>
  <text x="585" y="315" class="f-main">trunk</text>
</svg>
