# The URL the site will be built for
base_url = "https://veeg.dev"
title = "Veeg Blog"

compile_sass = false
build_search_index = false
generate_feeds = false

[markdown]
insert_anchor_links = "left"
# List footnotes at the bottom in reference order; static/style.css gives them symbols.
bottom_footnotes = true

[markdown.highlighting]
dark_theme = "kanagawa-wave"
light_theme = "github-light-high-contrast"
error_on_missing_language = true

[extra]
author = "Vegard Sandengen"
github = "veeg"
# How many posts the "Recent posts" sidebar lists.
recent_posts = 5
