<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  {# Apply a saved theme before first paint so the page never flashes the wrong colours. #}
  <script>
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <script src="{{ get_url(path='site.js', cachebust=true) }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ config.base_url }}/">{{ config.title }}</a>
    <nav class="site-nav">
      <a href="https://github.com/{{ config.extra.github }}">GitHub</a>
      <button id="theme-toggle" type="button" aria-label="Switch colour theme" hidden>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    © {{ config.extra.author }} · <a href="https://github.com/{{ config.extra.github }}">GitHub</a>
  </footer>
</body>
</html>
