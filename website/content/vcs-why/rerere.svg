<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-labelledby="title desc">
  <title id="title">git rerere: reuse recorded resolution</title>
  <desc id="desc">The first time a conflict appears, you resolve it by hand and git rerere records the resolution. Every time the identical conflict appears again, git rerere replays the recorded resolution, and you can continue without resolving it again.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #2a2723; }
    .title { font-size: 14px; font-weight: 700; letter-spacing: 0.12em; }
    .rule { stroke: #6f6a62; stroke-opacity: 0.35; stroke-width: 1; }
    .heading { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; fill: #6f6a62; }
    .note { font-size: 12px; font-style: italic; fill: #6f6a62; }
    .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .box { fill: #fbf8f1; stroke-width: 2.5; }
    .conflict { stroke: #c2410c; }
    .manual { stroke: #6f6a62; stroke-dasharray: 5 4; }
    .good { stroke: #1d6f66; }
    .flow { fill: none; stroke: #6f6a62; stroke-width: 2; }
    .reuse { fill: none; stroke: #1d6f66; stroke-width: 2; stroke-dasharray: 5 5; }
    .head-muted { fill: #6f6a62; }
    .head-teal { fill: #1d6f66; }
    @media (prefers-color-scheme: dark) {
      text { fill: #d9d6cf; }
      .rule, .flow, .manual { stroke: #8d8a83; }
      .heading, .note, .head-muted { fill: #8d8a83; }
      .box { fill: #121417; }
      .conflict { stroke: #fb923c; }
      .good, .reuse { stroke: #6fc2b8; }
      .head-teal { fill: #6fc2b8; }
    }
  </style>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head-muted" d="M0 0 L10 5 L0 10 Z"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head-teal" d="M0 0 L10 5 L0 10 Z"/></marker>
  </defs>
  <text x="390" y="26" text-anchor="middle" class="title">GIT RERERE</text>
  <line class="rule" x1="20" y1="40" x2="760" y2="40"/>

  <text x="20" y="94" class="heading">THE FIRST TIME</text>
  <rect class="box conflict" x="20" y="112" width="210" height="54" rx="8"/>
  <text x="125" y="135" text-anchor="middle">Conflict</text>
  <text x="125" y="153" text-anchor="middle">in the same hunk</text>
  <rect class="box manual" x="285" y="112" width="210" height="54" rx="8"/>
  <text x="390" y="135" text-anchor="middle">You resolve it</text>
  <text x="390" y="153" text-anchor="middle">by hand</text>
  <rect class="box good" x="550" y="112" width="210" height="54" rx="8"/>
  <text x="655" y="144" text-anchor="middle">Resolution recorded</text>
  <path class="flow" d="M234 139.0 H279" marker-end="url(#arrow-muted)"/>
  <path class="flow" d="M499 139.0 H544" marker-end="url(#arrow-muted)"/>

  <text x="20" y="236" class="heading">EVERY TIME AFTER</text>
  <rect class="box conflict" x="20" y="254" width="210" height="54" rx="8"/>
  <text x="125" y="277" text-anchor="middle">The identical conflict</text>
  <text x="125" y="295" text-anchor="middle">shows up again</text>
  <rect class="box good" x="285" y="254" width="210" height="54" rx="8"/>
  <text x="390" y="277" text-anchor="middle">Recorded resolution</text>
  <text x="390" y="295" text-anchor="middle">replayed</text>
  <rect class="box good" x="550" y="254" width="210" height="54" rx="8"/>
  <text x="655" y="286" text-anchor="middle">You carry on</text>
  <path class="flow" d="M234 281.0 H279" marker-end="url(#arrow-muted)"/>
  <path class="flow" d="M499 281.0 H544" marker-end="url(#arrow-muted)"/>
  <path class="reuse" d="M655 170 C655 215, 390 203, 390 248" marker-end="url(#arrow-teal)"/>
  <text x="669" y="196" class="mono note">.git/rr-cache</text>
</svg>
