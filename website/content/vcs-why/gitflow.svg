<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 290" width="730" height="290" role="img" aria-labelledby="title desc">
  <title id="title">The GitFlow branching model</title>
  <desc id="desc">Two long-lived branches, master and develop. Feature branches grow from and merge back into develop. Release branches grow from develop and merge into both master and develop. Hotfix branches grow from master and merge into both master and develop.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; }
    .tag { font-size: 12px; font-weight: 400; fill: #6f6a62; }
    .edge { fill: none; stroke-width: 4; stroke-linecap: round; }
    .commit { fill: #fbf8f1; stroke-width: 3; }
    .s-master { stroke: #1d6f66; }
    .f-master { fill: #1d6f66; }
    .s-develop { stroke: #c2410c; }
    .f-develop { fill: #c2410c; }
    .s-feature { stroke: #7e22ce; }
    .f-feature { fill: #7e22ce; }
    .s-release { stroke: #1d4ed8; }
    .f-release { fill: #1d4ed8; }
    .s-hotfix { stroke: #be123c; }
    .f-hotfix { fill: #be123c; }
    @media (prefers-color-scheme: dark) {
      .tag { fill: #8d8a83; }
      .commit { fill: #121417; }
      .s-master { stroke: #6fc2b8; }
      .f-master { fill: #6fc2b8; }
      .s-develop { stroke: #fb923c; }
      .f-develop { fill: #fb923c; }
      .s-feature { stroke: #c084fc; }
      .f-feature { fill: #c084fc; }
      .s-release { stroke: #60a5fa; }
      .f-release { fill: #60a5fa; }
      .s-hotfix { stroke: #fb7185; }
      .f-hotfix { fill: #fb7185; }
    }
  </style>

  <text x="20" y="45" class="f-hotfix">hotfix</text>
  <text x="20" y="100" class="f-master">master</text>
  <text x="20" y="155" class="f-release">release</text>
  <text x="20" y="210" class="f-develop">develop</text>
  <text x="20" y="265" class="f-feature">feature</text>

  <path class="edge s-master" d="M150 95 H710"/>
  <path class="edge s-develop" d="M200 205 H710"/>
  <path class="edge s-develop" d="M150 95 C175 95, 175 205, 200 205"/>
  <path class="edge s-hotfix" d="M150 95 C200 95, 200 40, 250 40"/>
  <path class="edge s-hotfix" d="M250 40 H320"/>
  <path class="edge s-hotfix" d="M320 40 C350 40, 350 95, 380 95"/>
  <path class="edge s-hotfix" d="M320 40 C365 40, 365 205, 410 205"/>
  <path class="edge s-feature" d="M260 205 C285 205, 285 260, 310 260"/>
  <path class="edge s-feature" d="M310 260 H420"/>
  <path class="edge s-feature" d="M420 260 C445 260, 445 205, 470 205"/>
  <path class="edge s-release" d="M470 205 C495 205, 495 150, 520 150"/>
  <path class="edge s-release" d="M520 150 H580"/>
  <path class="edge s-release" d="M580 150 C610 150, 610 95, 640 95"/>
  <path class="edge s-release" d="M580 150 C620 150, 620 205, 660 205"/>

  <circle class="commit s-master" cx="150" cy="95" r="8"/>
  <circle class="commit s-master" cx="380" cy="95" r="8"/>
  <circle class="commit s-master" cx="640" cy="95" r="8"/>
  <circle class="commit s-hotfix" cx="320" cy="40" r="8"/>
  <circle class="commit s-develop" cx="200" cy="205" r="8"/>
  <circle class="commit s-develop" cx="260" cy="205" r="8"/>
  <circle class="commit s-develop" cx="410" cy="205" r="8"/>
  <circle class="commit s-develop" cx="470" cy="205" r="8"/>
  <circle class="commit s-develop" cx="660" cy="205" r="8"/>
  <circle class="commit s-feature" cx="310" cy="260" r="8"/>
  <circle class="commit s-feature" cx="360" cy="260" r="8"/>
  <circle class="commit s-feature" cx="420" cy="260" r="8"/>
  <circle class="commit s-release" cx="520" cy="150" r="8"/>
  <circle class="commit s-release" cx="580" cy="150" r="8"/>

  <text x="140" y="121" text-anchor="end" class="tag">1.0</text>
  <text x="390" y="121" text-anchor="start" class="tag">1.0.1</text>
  <text x="640" y="121" text-anchor="middle" class="tag">1.1</text>
</svg>
